services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }" ]
      interval: 5s
      timeout: 10s
      retries: 10
  backend:
    build: ./backend
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/memed?replicaSet=rs0
      JWT_SECRET: local-development-only-change-this-secret
      CLIENT_ORIGIN: http://localhost:3000
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
